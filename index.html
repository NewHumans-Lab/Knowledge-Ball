<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050b0f">
<title>Knowledge Ball</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;600&display=swap');
:root{
  --bg:#050b0f;--panel:#071318;--panel-border:#17343a;--ink:#e5f0f1;--ink-dim:#8ca4a6;--ink-faint:#546b6f;
  --teal:#75e0d3;--orange:#ef9b62;--green:#9bc779;--yellow:#f0c66e;--red:#e56f69;--purple:#9c87d9;
  --app-height:100vh;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Noto Sans SC',sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit}
button{color:inherit}
#app{position:relative;width:100%;height:var(--app-height);overflow:hidden;background:radial-gradient(circle at 50% 48%,#0a1b20 0,#071217 38%,#050b0f 72%)}
#canvasHost{position:absolute;inset:0;touch-action:none}
#labelsLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.node-label{position:absolute;white-space:nowrap;font-size:10px;color:#9cb1b4;transform:translate(-50%,-50%);text-shadow:0 1px 4px #000;opacity:.85;pointer-events:none;will-change:transform}
.node-label.selected{color:#fff;font-weight:500}
header{position:absolute;left:12px;top:12px;z-index:40;display:flex;align-items:center;gap:11px;padding:9px 12px;border:1px solid rgba(117,224,211,.12);border-radius:10px;background:rgba(4,14,18,.72);backdrop-filter:blur(12px)}
.logo{width:28px;height:28px;border-radius:50%;border:1px solid rgba(117,224,211,.7);box-shadow:inset 0 0 10px rgba(117,224,211,.35),0 0 18px rgba(117,224,211,.12);position:relative}
.logo:before,.logo:after{content:"";position:absolute;border:1px solid rgba(117,224,211,.28);border-radius:50%;inset:4px}.logo:after{inset:8px;border-color:rgba(240,198,110,.45)}
.brand-title{font:500 12px/1.1 'JetBrains Mono',monospace;letter-spacing:.18em}.brand-subtitle{font-size:8px;color:var(--ink-faint);margin-top:3px;letter-spacing:.08em}
header .avatar-btn{width:31px;height:31px;border-radius:50%;border:1px solid var(--panel-border);background:#0a171c;margin-left:3px;display:grid;place-items:center;cursor:pointer;color:var(--ink-dim)}
.hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:30;font:10px 'JetBrains Mono',monospace;color:var(--ink-faint);letter-spacing:.08em;background:rgba(5,11,15,.58);padding:6px 10px;border-radius:8px;backdrop-filter:blur(8px)}
.legend{position:absolute;left:14px;bottom:14px;z-index:30;display:flex;gap:11px;align-items:center;background:rgba(5,11,15,.58);border:1px solid rgba(117,224,211,.1);padding:7px 9px;border-radius:8px;backdrop-filter:blur(8px);font-size:9px;color:var(--ink-faint)}
.legend-item{display:flex;align-items:center;gap:5px}.legend-dot{width:7px;height:7px;border-radius:50%}
.ai-bar{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:45;width:min(620px,calc(100% - 28px));display:flex;align-items:center;gap:7px;padding:7px;border:1px solid var(--panel-border);border-radius:12px;background:rgba(5,17,22,.86);backdrop-filter:blur(15px);box-shadow:0 10px 34px rgba(0,0,0,.28)}
.ai-input-wrap{flex:1;display:flex;align-items:center;background:#09161b;border:1px solid #18333a;border-radius:8px;padding:0 8px}.ai-input-wrap input{width:100%;height:34px;border:0;outline:0;background:transparent;color:var(--ink);font-size:12px}.ai-input-wrap input::placeholder{color:#4d6265}.ai-send,.ai-add{height:34px;min-width:38px;border-radius:8px;border:1px solid #204048;background:#0b2025;display:grid;place-items:center;cursor:pointer}.ai-add{font-size:20px;color:var(--teal);line-height:1}.ai-send{color:var(--ink-dim)}
.ai-results{position:absolute;left:50%;bottom:67px;transform:translateX(-50%);z-index:44;width:min(620px,calc(100% - 28px));max-height:240px;overflow:auto;background:#071318;border:1px solid var(--panel-border);border-radius:10px;padding:8px;display:none;box-shadow:0 20px 45px rgba(0,0,0,.42)}.ai-results.show{display:block}.ai-result{padding:8px 9px;border-radius:7px;cursor:pointer;font-size:11px;color:var(--ink-dim)}.ai-result:hover{background:#0c2026;color:var(--ink)}
.panel{position:absolute;right:12px;top:12px;bottom:70px;width:min(360px,calc(100% - 24px));z-index:60;border:1px solid var(--panel-border);border-radius:12px;background:rgba(5,18,23,.97);box-shadow:0 24px 70px rgba(0,0,0,.42);display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:translateX(16px);transition:opacity .18s ease,transform .18s ease;overflow:hidden}.panel.open{opacity:1;pointer-events:auto;transform:none}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:12px 13px;border-bottom:1px solid #153039}.panel-title{font-size:14px;font-weight:600}.panel-close{width:30px;height:30px;border:0;background:transparent;color:var(--ink-dim);font-size:20px;cursor:pointer}.panel-body{padding:12px 13px;overflow-y:auto;overscroll-behavior:contain;flex:1}.panel-actions{padding:10px 12px;border-top:1px solid #153039;display:flex;gap:7px;flex-wrap:wrap}.field{margin-bottom:12px}.field>label{display:block;font-size:9px;letter-spacing:.08em;color:var(--ink-faint);margin-bottom:5px;text-transform:uppercase}.field .val{font-size:12px;line-height:1.65;color:#c6d4d5;white-space:pre-wrap;overflow-wrap:anywhere}.badge-row,.chip-list{display:flex;flex-wrap:wrap;gap:6px}.badge,.chip{border:1px solid #1b3a42;border-radius:999px;padding:3px 7px;font-size:9px;color:#86a2a5;background:#0a1b20}.chip[data-jump],.chip[data-mastery]{cursor:pointer}.chip.active{border-color:rgba(117,224,211,.7);color:var(--teal);background:rgba(117,224,211,.08)}.mastery-display{font-size:13px;color:#d6e4e5}.mastery-demo-controls{display:flex;gap:5px;flex-wrap:wrap}.field-reasoning-band{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:6px;margin:9px 0 14px;padding:8px;border:1px solid rgba(117,224,211,.12);border-radius:8px;background:#07171b}.reasoning-stage{font-size:8px;color:var(--ink-faint);text-align:center}.reasoning-stage b{display:block;margin-top:3px;color:#9ec3c3;font-weight:500}.reasoning-arrow{color:var(--teal);font-size:12px}.btn{height:32px;border-radius:7px;border:1px solid #24474f;background:#0b2026;padding:0 10px;font-size:10px;cursor:pointer}.btn.primary{border-color:rgba(117,224,211,.55);color:var(--teal)}.btn.danger{border-color:rgba(229,111,105,.45);color:#ef928d}.btn.ghost{background:transparent;color:var(--ink-dim)}
.modal-overlay{position:fixed;inset:0;background:rgba(6,9,17,0.92);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}.modal-overlay.show{display:flex}.modal{background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;width:100%;max-width:460px;max-height:min(88vh,780px);overflow:auto;padding:17px}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.modal-head h3{margin:0;font-size:15px}.modal-close{border:0;background:transparent;color:var(--ink-dim);font-size:20px;cursor:pointer}.modal .field input,.modal .field textarea,.modal .field select,.panel .field input,.panel .field textarea,.panel .field select{width:100%;border:1px solid #1b3b43;border-radius:7px;background:#08171c;color:var(--ink);outline:0;padding:8px 9px;font-size:11px}.modal .field textarea,.panel .field textarea{min-height:72px;resize:vertical}.premise-list{max-height:150px;overflow:auto;border:1px solid #15323a;border-radius:7px;padding:6px}.premise-item{display:flex;gap:7px;align-items:flex-start;padding:5px;font-size:10px;color:var(--ink-dim)}.premise-item input{width:auto!important;margin-top:2px}.note-small{font-size:9px;color:var(--ink-faint);line-height:1.55}.counterexample-callout,.difference-card{border:1px solid rgba(229,111,105,.24);background:rgba(229,111,105,.06);padding:8px;border-radius:7px;font-size:10px;color:#d0b2b0;margin-bottom:10px}.difference-card{border-color:rgba(240,198,110,.24);background:rgba(240,198,110,.06);color:#d9c79b}.operation-progress{height:3px;border-radius:99px;background:#11272d;overflow:hidden;margin:7px 0 12px}.operation-progress span{display:block;height:100%;background:var(--teal)}
.account-card{width:min(420px,100%);padding:20px}.account-profile{display:flex;gap:12px;align-items:center;margin-bottom:16px}.account-avatar{width:48px;height:48px;border-radius:50%;background:#0c2329;border:1px solid #24515a;display:grid;place-items:center;color:var(--teal);font-size:18px}.account-name{font-size:14px}.account-id{font:9px 'JetBrains Mono';color:var(--ink-faint);margin-top:3px}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat-card{background:#08191e;border:1px solid #15343c;border-radius:8px;padding:10px}.stat-num{font:500 16px 'JetBrains Mono';color:#d8e8e9}.stat-label{font-size:8px;color:var(--ink-faint);margin-top:4px}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.settings-grid .full{grid-column:1/-1}.settings-grid input[type=range]{width:100%;accent-color:#75e0d3}.range-row{display:flex;align-items:center;gap:8px}.range-val{font:10px 'JetBrains Mono';color:var(--teal);width:52px;text-align:right}.color-row{display:flex;gap:8px}.color-row input[type=color]{width:45px;height:32px;padding:2px;border:1px solid #1b3b43;background:#08171c;border-radius:6px}.toast{position:fixed;left:50%;top:65px;transform:translateX(-50%) translateY(-6px);opacity:0;z-index:200;background:#0a1d22;border:1px solid #24505a;border-radius:8px;padding:8px 12px;color:#bbd2d4;font-size:11px;transition:.18s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:86%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.app-download-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.native-app .app-download-grid{grid-template-columns:1fr}
@media(max-width:780px){header,.hint,.ai-bar,.legend,.node-label,.ai-results{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}#panel{position:fixed;inset:0;width:100%;border-radius:0;box-shadow:none;background:#051217}.panel{width:min(340px,90vw)}.legend{display:none}.hint{display:none}.settings-grid{grid-template-columns:1fr}.ai-results{bottom:66px}.modal{max-height:calc(var(--app-height) - 28px)}}
body{background:#050b0f}
header{background:rgba(2,9,13,.8);backdrop-filter:blur(18px);border-color:var(--panel-border);padding:11px 16px}.brand-copy{display:flex;flex-direction:column;gap:2px}.brand-title{font:600 13px/1 'Inter',sans-serif;color:var(--ink);letter-spacing:.08em}.brand-subtitle{font-size:9px!important;color:var(--ink-faint)!important;letter-spacing:.14em!important}.avatar-btn{border-radius:10px;background:#0b2227;border-color:rgba(117,224,211,.3);color:var(--ink-dim)}.ai-results{background:rgba(5,18,23,.86);backdrop-filter:blur(22px) saturate(110%);-webkit-backdrop-filter:blur(22px) saturate(110%)}
/* Do not backdrop-filter over the live WebGL canvas. On mobile GPUs this forces an expensive canvas readback/composite and can freeze the page. */
.panel{top:12px;right:12px;bottom:72px;width:338px;background:rgb(5,18,23);border:1px solid var(--panel-border);border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:none}.modal{background:rgb(5,18,23)}.panel.open{opacity:1;pointer-events:auto}.ai-bar{max-width:552px;margin:auto;background:rgba(5,19,24,.84);border-color:var(--panel-border);box-shadow:0 16px 46px rgba(0,0,0,.38)}.node-label{background:rgba(2,9,13,.52);border:1px solid rgba(117,224,211,.1);color:#c7dbdd;padding:2px 6px;border-radius:5px;text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<div id="app">
  <div id="canvasHost"></div>
  <div id="labelsLayer"></div>
  <header><div class="logo"></div><div class="brand-copy"><div class="brand-title">KNOWLEDGE BALL</div><div class="brand-subtitle">PUBLIC KNOWLEDGE GRAPH</div></div><button class="avatar-btn" id="accountBtn">◎</button></header>
  <div class="hint">拖拽旋转 · 滚轮/双指缩放 · 点击节点查看</div>
  <div class="legend"><div class="legend-item"><span class="legend-dot" style="background:#75e0d3"></span>定义</div><div class="legend-item"><span class="legend-dot" style="background:#ef9b62"></span>事实</div><div class="legend-item"><span class="legend-dot" style="background:#9bc779"></span>定理</div><div class="legend-item"><span class="legend-dot" style="background:#9c87d9"></span>逻辑</div></div>
  <div class="ai-results" id="aiResults"></div>
  <div class="ai-bar"><div class="ai-input-wrap"><input id="aiInput" placeholder="搜索知识节点…"></div><button class="ai-send" id="aiSend">⌕</button><button class="ai-add" id="aiAdd">＋</button></div>
  <aside class="panel" id="panel"><div class="panel-head"><div class="panel-title" id="panelTitle">节点</div><button class="panel-close" id="panelClose">×</button></div><div class="panel-body" id="panelBody"></div><div class="panel-actions" id="panelActions"></div></aside>
</div>

<div class="modal-overlay" id="modalOverlay"><div class="modal"><div class="modal-head"><h3 id="modalTitle">提交新知识节点</h3><button class="modal-close" id="modalClose">×</button></div><p class="note-small" id="modalHint" style="display:none"></p><div class="field"><label>Original title</label><input id="fTitle"></div><div class="field"><label>Canonical English</label><input id="fCanonical"></div><div class="field"><label>Type</label><select id="fType"><option value="fact">事实</option><option value="definition">定义</option><option value="axiom">公理</option><option value="logic-symbol">逻辑符号</option><option value="theorem">定理</option><option value="hypothesis">假说</option><option value="prediction">预测</option><option value="opinion">观点</option><option value="value">价值判断</option></select></div><div class="field"><label>Description</label><textarea id="fDescription"></textarea></div><div class="field" id="fReasoningField"><label>Reasoning</label><textarea id="fReasoning"></textarea></div><div class="field" id="fPremisesField"><label>Premises</label><div class="premise-list" id="fPremises"></div></div><div class="field" id="fLogicRuleField"><label>Logic rule</label><select id="fLogicRule"></select></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" id="modalCancel">取消</button><button class="btn primary" id="modalSubmit">提交</button></div></div></div>

<div class="modal-overlay" id="accountOverlay"><div class="modal account-card"><div class="modal-head"><h3>账户</h3><button class="modal-close" id="accountClose">×</button></div><div class="account-profile"><div class="account-avatar">KB</div><div><div class="account-name">Knowledge Ball User</div><div class="account-id">LOCAL / GUEST</div></div></div><div class="stat-grid"><div class="stat-card"><div class="stat-num" id="statRep">—</div><div class="stat-label">我的能量</div></div><div class="stat-card"><div class="stat-num" id="statLit">0</div><div class="stat-label">已接触节点</div></div><div class="stat-card"><div class="stat-num" id="statContrib">0</div><div class="stat-label">待验证贡献</div></div></div></div></div>

<div class="modal-overlay" id="settingsOverlay"><div class="modal"><div class="modal-head"><h3>显示设置</h3><button class="modal-close" id="settingsClose">×</button></div><div class="settings-grid"><div class="field"><label>节点半径</label><div class="range-row"><input id="setNodeRadius" type="range" min="2" max="16" step="0.5"><span class="range-val" id="setNodeRadiusVal"></span></div></div><div class="field"><label>标签大小</label><div class="range-row"><input id="setLabelSize" type="range" min="7" max="18" step="1"><span class="range-val" id="setLabelSizeVal"></span></div></div><div class="field"><label>标签亮度</label><div class="range-row"><input id="setLabelBrightness" type="range" min="10" max="100" step="5"><span class="range-val" id="setLabelBrightnessVal"></span></div></div><div class="field"><label>标签颜色</label><div class="color-row"><input id="setLabelColor" type="color"><select id="setLabelFont"><option value="sans">Sans</option><option value="mono">Mono</option></select></div></div><div class="field full"><label>依赖深度限制</label><input id="depthLimit" type="number" min="0" max="20" placeholder="不限"></div></div></div></div>
<div class="toast" id="toast"></div>
<script type="module" src="/src/ui/app.ts"></script>
</body>
</html>
