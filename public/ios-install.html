<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080c16">
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <title>安装知识球 iOS 应用</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080c16;color:#e8eaf1;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif;padding:24px;box-sizing:border-box}
    main{position:relative;max-width:520px;background:#11182b;border:1px solid #2b3550;border-radius:16px;padding:68px 28px 28px;box-shadow:0 18px 60px #0008}
    h1{font-size:23px;margin:0 0 10px}p,li{color:#b8bfd4;line-height:1.75}ol{padding-left:22px}.badge{color:#d8ac22;font-size:13px}.button{display:block;text-align:center;margin-top:20px;padding:13px;background:#d8ac22;color:#111;text-decoration:none;border-radius:9px;font-weight:700}
    .exit{position:absolute;top:12px;right:12px;width:44px;height:44px;display:grid;place-items:center;border:1px solid #33415f;border-radius:50%;background:#0b1221;color:#e8eaf1;font-size:18px;cursor:pointer}
    .exit:focus-visible,.language button:focus-visible{outline:2px solid #75e0d3;outline-offset:2px}
    .language{position:absolute;top:15px;left:18px;display:flex;gap:6px}.language button{border:1px solid #33415f;border-radius:8px;background:#0b1221;color:#b8bfd4;padding:7px 9px;cursor:pointer}.language button[aria-pressed="true"]{border-color:#75e0d3;color:#e8eaf1}
    .install-logo{display:block;width:88px;height:88px;object-fit:contain;margin:0 auto 20px}
  </style>
</head>
<body>
  <main>
    <div class="language" role="group" aria-label="语言 / Language">
      <button type="button" data-locale="zh-CN">中文</button><button type="button" data-locale="en">English</button>
    </div>
    <button class="exit" type="button" onclick="if(history.length>1){history.back()}else{location.href='./'}">❌</button>
    <img class="install-logo" src="./brand/knowledge-ball-logo.png" alt="Knowledge Ball">
    <div class="badge" data-key="badge">知识球 iOS · v0.2.0</div>
    <h1 data-key="title">使用 Safari 安装 iOS 应用</h1>
    <p data-key="intro">此版本作为可安装的 iOS Web App 发布，无需境外应用商店或 VPN，数据和功能与网页版保持同步。</p>
    <ol>
      <li data-key="step1">点击 Safari 底部或顶部的“分享”按钮。</li>
      <li data-key="step2">选择“添加到主屏幕”。</li>
      <li data-key="step3">确认名称后点击“添加”，以后从桌面启动。</li>
    </ol>
    <a class="button" href="./" data-key="open">打开知识球并安装</a>
  </main>
  <script>
    (() => {
      const storageKey = 'knowledge-ball.locale.v1';
      const copy = {
        'zh-CN': {
          documentTitle: '安装知识球 iOS 应用', back: '返回上一页', badge: '知识球 iOS · v0.2.0',
          title: '使用 Safari 安装 iOS 应用',
          intro: '此版本作为可安装的 iOS Web App 发布，无需境外应用商店或 VPN，数据和功能与网页版保持同步。',
          step1: '点击 Safari 底部或顶部的“分享”按钮。', step2: '选择“添加到主屏幕”。',
          step3: '确认名称后点击“添加”，以后从桌面启动。', open: '打开知识球并安装',
        },
        en: {
          documentTitle: 'Install Knowledge Ball for iOS', back: 'Back', badge: 'Knowledge Ball iOS · v0.2.0',
          title: 'Install the iOS app with Safari',
          intro: 'This release is an installable iOS Web App. It does not require a foreign app store or VPN, and its data and features stay in sync with the web version.',
          step1: 'Tap Safari’s Share button at the bottom or top of the screen.', step2: 'Choose “Add to Home Screen”.',
          step3: 'Confirm the name and tap “Add”, then launch it from the Home Screen.', open: 'Open Knowledge Ball and install',
        },
      };
      let locale;
      try { locale = localStorage.getItem(storageKey); } catch {}
      if (locale !== 'en' && locale !== 'zh-CN') locale = 'zh-CN';
      const apply = next => {
        locale = next;
        try { localStorage.setItem(storageKey, next); } catch {}
        const strings = copy[next];
        document.documentElement.lang = next;
        document.title = strings.documentTitle;
        const exit = document.querySelector('.exit');
        exit.setAttribute('aria-label', strings.back); exit.setAttribute('title', strings.back);
        document.querySelectorAll('[data-key]').forEach(element => { element.textContent = strings[element.dataset.key]; });
        document.querySelectorAll('[data-locale]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.locale === next)));
      };
      document.querySelectorAll('[data-locale]').forEach(button => button.addEventListener('click', () => apply(button.dataset.locale)));
      apply(locale);
    })();
  </script>
</body>
</html>
