name: Temporary remove edit merge

on:
  push:
    branches: [cleanup/remove-edit-merge-and-1s-hold]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-edit-merge-and-1s-hold
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply exact cleanup
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace(path, old, new, expected=1):
              text = read(path)
              count = text.count(old)
              assert count == expected, f'{path}: expected {expected} exact matches, got {count}: {old[:80]!r}'
              write(path, text.replace(old, new))

          def sub(path, pattern, replacement='', expected=1, flags=re.S):
              text = read(path)
              result, count = re.subn(pattern, replacement, text, flags=flags)
              assert count == expected, f'{path}: expected {expected} regex matches, got {count}: {pattern[:100]!r}'
              write(path, result)

          # 1) Chain isolation is now a deliberate one-second hold.
          replace('src/ui/scene/ChainIsolation.ts',
                  'export const CHAIN_ISOLATION_LONG_PRESS_MS = 2500;',
                  'export const CHAIN_ISOLATION_LONG_PRESS_MS = 1000;')
          replace('src/ui/scene/ChainIsolation.test.ts',
                  "assert.equal(CHAIN_ISOLATION_LONG_PRESS_MS, 2500, 'long press should stay inside the requested 2-3 second band');",
                  "assert.equal(CHAIN_ISOLATION_LONG_PRESS_MS, 1000, 'long press must trigger after one second');")
          replace('src/ui/scene/ChainIsolation.test.ts',
                  "assert(sceneSource.includes('}, CHAIN_ISOLATION_LONG_PRESS_MS);'), 'hold timer must use the shared 2.5 second threshold');",
                  "assert(sceneSource.includes('}, CHAIN_ISOLATION_LONG_PRESS_MS);'), 'hold timer must use the shared one-second threshold');")
          replace('scripts/verify-chain-isolation-browser.mjs',
                  'await page.waitForTimeout(2650);',
                  'await page.waitForTimeout(1150);')

          # 2) Remove merge as an active protocol operation.
          sub('src/protocol/KnowledgeEditingProtocol.ts',
              r"\nexport interface DefinitionMergeEdit \{.*?\nexport type MergeEdit = DefinitionMergeEdit \| TheoryMergeEdit;\n")
          replace('src/protocol/KnowledgeEditingProtocol.ts',
                  'export type KnowledgeEdit = NegateEdit | DecomposeEdit | MergeEdit | AddEdit;',
                  'export type KnowledgeEdit = NegateEdit | DecomposeEdit | AddEdit;')
          sub('src/protocol/KnowledgeEditingProtocol.ts',
              r"\n  if \(edit\.kind === 'merge' && edit\.mode === 'definition'\) \{.*?\n  return unique\(errors\);",
              '\n  return unique(errors);')
          sub('src/protocol/KnowledgeEditingProtocol.ts',
              r"\n  if \(edit\.kind === 'merge' && edit\.mode === 'definition'\) \{.*?\n  if \(edit\.kind === 'merge' && edit\.mode === 'theory'\) \{.*?\n  \}\n(?=\}\n\n/\*\*)",
              '\n')

          # 3) Remove KnowledgeMerged from the writable/replay event model. Hosted authority has zero such events.
          replace('src/event/Event.ts',
                  "import type { AddEdit, DecomposeEdit, MergeEdit, NegateEdit } from '../protocol/KnowledgeEditingProtocol';",
                  "import type { AddEdit, DecomposeEdit, NegateEdit } from '../protocol/KnowledgeEditingProtocol';")
          sub('src/event/Event.ts', r"\nexport type KnowledgeMergedEvent = EventEnvelope<'KnowledgeMerged', \{ edit: MergeEdit \}>;")
          replace('src/event/Event.ts',
                  '  | KnowledgeAddedEvent | KnowledgeNegatedEvent | KnowledgeDecomposedEvent | KnowledgeMergedEvent\n',
                  '  | KnowledgeAddedEvent | KnowledgeNegatedEvent | KnowledgeDecomposedEvent\n')
          replace('src/event/Event.ts',
                  "export function isCanonicalPublicKnowledgeEvent(event: DomainEvent): event is KnowledgeAddedEvent | KnowledgeNegatedEvent | KnowledgeDecomposedEvent | KnowledgeMergedEvent | KnowledgeStatusChangedEvent | KnowledgeNodeEditedEvent {\n  return event.scope === 'public' && ['KnowledgeAdded','KnowledgeNegated','KnowledgeDecomposed','KnowledgeMerged','KnowledgeStatusChanged','KnowledgeNodeEdited'].includes(event.type);\n}",
                  "export function isCanonicalPublicKnowledgeEvent(event: DomainEvent): event is KnowledgeAddedEvent | KnowledgeNegatedEvent | KnowledgeDecomposedEvent | KnowledgeStatusChangedEvent | KnowledgeNodeEditedEvent {\n  return event.scope === 'public' && ['KnowledgeAdded','KnowledgeNegated','KnowledgeDecomposed','KnowledgeStatusChanged','KnowledgeNodeEdited'].includes(event.type);\n}")

          replace('src/command/KnowledgeEdit.ts',
                  "function eventTypeFor(edit: KnowledgeEdit): DomainEvent['type'] {\n  if (edit.kind === 'add') return 'KnowledgeAdded';\n  if (edit.kind === 'negate') return 'KnowledgeNegated';\n  if (edit.kind === 'decompose') return 'KnowledgeDecomposed';\n  return 'KnowledgeMerged';\n}",
                  "function eventTypeFor(edit: KnowledgeEdit): DomainEvent['type'] {\n  if (edit.kind === 'add') return 'KnowledgeAdded';\n  if (edit.kind === 'negate') return 'KnowledgeNegated';\n  return 'KnowledgeDecomposed';\n}")
          replace('src/command/KnowledgeEdit.ts',
                  ' * The only write boundary for add/negate/decompose/merge. Validation runs against',
                  ' * The only write boundary for add/negate/decompose. Validation runs against')
          replace('src/projection/GraphProjection.ts',
                  "      case 'KnowledgeNegated':\n      case 'KnowledgeDecomposed':\n      case 'KnowledgeMerged': {",
                  "      case 'KnowledgeNegated':\n      case 'KnowledgeDecomposed': {")

          # 4) Remove merge from detail actions and all panel/controller wiring.
          replace('src/ui/panels/NodeDetailController.ts',
                  "export type NodeDetailAction = 'edit' | 'derive' | 'derive-reasoning' | 'negate' | 'decompose' | 'merge' | 'resolve' | 'dispute';",
                  "export type NodeDetailAction = 'edit' | 'derive' | 'derive-reasoning' | 'negate' | 'decompose' | 'resolve' | 'dispute';")
          replace('src/ui/panels/NodeDetailController.ts', "  merge: '合并',\n", '')

          panel = 'src/ui/panels/PanelController.ts'
          sub(panel, r"\nexport interface MergeDefinitionPayload \{.*?\n\}\n\nexport interface MergeTheoryPayload \{.*?\n\}\n")
          for line in [
              '  onMergeDefinitions: (payload: MergeDefinitionPayload) => Promise<void> | void;\n',
              '  onMergeTheories: (payload: MergeTheoryPayload) => Promise<void> | void;\n',
              '  private readonly onMergeDefinitions: (payload: MergeDefinitionPayload) => Promise<void> | void;\n',
              '  private readonly onMergeTheories: (payload: MergeTheoryPayload) => Promise<void> | void;\n',
              '    this.onMergeDefinitions = options.onMergeDefinitions;\n',
              '    this.onMergeTheories = options.onMergeTheories;\n',
          ]:
              replace(panel, line, '')
          replace(panel,
                  "export type PanelNodeAction = 'edit' | 'negate' | 'decompose' | 'merge' | 'resolve' | 'dispute';",
                  "export type PanelNodeAction = 'edit' | 'negate' | 'decompose' | 'resolve' | 'dispute';")
          replace(panel,
                  "      <div class=\"action-grid\">\n        ${node.type === 'reasoning' ? '<button class=\"btn ghost\" id=\"btnDecompose\">Decompose · 分解</button>' : ''}\n        ${this.canMerge(node, nodes, byId) ? '<button class=\"btn ghost\" id=\"btnMerge\">Merge · 合并</button>' : ''}\n      </div>\n",
                  "      ${node.type === 'reasoning' ? '<div class=\"action-grid\"><button class=\"btn ghost\" id=\"btnDecompose\">Decompose · 分解</button></div>' : ''}\n")
          replace(panel,
                  "  openNodeAction(id: string, action: PanelNodeAction): boolean {\n    const nodes = this.getNodes();\n    const byId = new Map(nodes.map(node => [node.id, node] as const));\n    const node = byId.get(id);\n    if (!node || !this.supportsNodeAction(node, action, nodes, byId)) return false;",
                  "  openNodeAction(id: string, action: PanelNodeAction): boolean {\n    const node = this.getNodeById(id);\n    if (!node || !this.supportsNodeAction(node, action)) return false;")
          sub(panel,
              r"  private supportsNodeAction\(\n    node: PanelNodeSummary,\n    action: PanelNodeAction,\n    nodes = this\.getNodes\(\),\n    byId: ReadonlyMap<string, PanelNodeSummary> = new Map\(nodes\.map\(item => \[item\.id, item\] as const\)\),\n  \): boolean \{",
              "  private supportsNodeAction(node: PanelNodeSummary, action: PanelNodeAction): boolean {")
          replace(panel, "      case 'merge': return this.canMerge(node, nodes, byId);\n", '')
          replace(panel, "      case 'merge':\n        this.openMergeForm(id);\n        return;\n", '')
          replace(panel, "    const mergeBtn = this.panelActions.querySelector<HTMLButtonElement>('#btnMerge');\n", '')
          replace(panel, "    mergeBtn?.addEventListener('click', () => this.executeNodeAction(id, 'merge'));\n", '')
          sub(panel,
              r"\n  private reasoningParent\(.*?\n  private showOperationError",
              '\n  private showOperationError')
          sub(panel,
              r"\n  private openMergeForm\(.*?\n  private renderPremiseList",
              '\n  private renderPremiseList')

          # 5) Remove application merge eligibility, handlers, and callbacks.
          app = 'src/ui/app.ts'
          replace(app,
                  "import {\n  type AddEdit,\n  type DecomposeEdit,\n  type MergeEdit,\n} from '../protocol/KnowledgeEditingProtocol';",
                  "import {\n  type AddEdit,\n  type DecomposeEdit,\n} from '../protocol/KnowledgeEditingProtocol';")
          replace(app, '  type MergeDefinitionPayload,\n', '')
          replace(app, '  type MergeTheoryPayload,\n', '')
          sub(app,
              r"\nfunction reasoningParentForDetail\(.*?\nfunction getNodeDetailActions",
              '\nfunction getNodeDetailActions')
          replace(app, "  if (canMergeFromDetail(node)) actions.push('merge');\n", '')
          sub(app,
              r"\nasync function mergeDefinitions\(.*?\nasync function resolveKnowledgeNode",
              '\nasync function resolveKnowledgeNode')
          replace(app, '  onMergeDefinitions: mergeDefinitions,\n', '')
          replace(app, '  onMergeTheories: mergeTheories,\n', '')

          # 6) Delete merge-only system copy and runtime translation hooks.
          catalog = Path('src/i18n/SystemCatalog.ts')
          text = catalog.read_text()
          merge_keys = {
              'panel.merge','panel.differenceReviewTitle','panel.definitionMergeReview','panel.otherLanguageDefinitions',
              'panel.semanticEquivalence','panel.definitionSemanticPlaceholder','panel.unifiedDefinitionTitle',
              'panel.unifiedDefinitionDescription','panel.definitionMergeNote','panel.definitionMergeSubmit',
              'panel.definitionMergeIncomplete','panel.definitionMergeSubmitted','panel.reasoningChainDiffTitle',
              'panel.theoryMergeReview','panel.sameReasoningConclusions','panel.reasoningSemanticEquivalence',
              'panel.conclusionSemanticEquivalence','panel.unifiedReasoningTitle','panel.unifiedReasoning',
              'panel.unifiedReasoningLogic','panel.unifiedConclusionTitle','panel.unifiedConclusionDescription',
              'panel.theoryMergeNote','panel.theoryMergeSubmit','panel.theoryMergeIncomplete','panel.theoryMergeSubmitted',
              'detail.actionMerge',
          }
          kept=[]; removed=[]
          for line in text.splitlines(True):
              match = re.match(r"\s*'([^']+)':", line)
              if match and match.group(1) in merge_keys:
                  removed.append(match.group(1))
              else:
                  kept.append(line)
          missing = merge_keys - set(removed)
          assert not missing, f'SystemCatalog merge keys not found: {sorted(missing)}'
          catalog.write_text(''.join(kept))

          locale = Path('src/i18n/Locale.ts')
          lines = locale.read_text().splitlines(True)
          filtered=[]; removed_patterns=0
          for line in lines:
              if any(token in line for token in ['合并定义：','合并理论：','合并推理：','Merge definition:','Merge theory:','Merge reasoning:']):
                  removed_patterns += 1
                  continue
              filtered.append(line)
          text=''.join(filtered)
          assert removed_patterns == 6, f'expected 6 wrapped merge translation patterns, got {removed_patterns}'
          old = ", '#mergeLogicRule option:not([value=\"\"])'"
          assert old in text, 'merge logic selector not found in Locale user-text selector'
          text = text.replace(old, '')
          locale.write_text(text)

          # 7) Replace merge protocol tests with a direct hidden-history title reservation fixture.
          tests = 'src/protocol/KnowledgeEditingProtocol.test.ts'
          sub(tests,
              r"\n// Definitions merge from distinct descriptions of the same declared semantic identity\..*?\n// Historical hidden nodes reserve titles; duplicate descriptions are advisory only\.\nconst duplicateHidden = validateKnowledgeEdit\(mergedDefinitions, \{.*?assert\.deepEqual\(duplicateHiddenDescription, \[\]\);",
              "\n// Historical hidden nodes reserve titles; duplicate descriptions are advisory only.\nconst hiddenHistory = [\n  ...base,\n  node('def-en', 'definition', [], 'A prime has exactly two positive divisors', { hidden: true, status: 'suspended', supersededBy: 'def-current' }),\n  node('def-current', 'definition', [], 'Current canonical prime definition'),\n];\nconst duplicateHidden = validateKnowledgeEdit(hiddenHistory, {\n  kind: 'add',\n  mode: 'atomic',\n  node: { id: 'duplicate-hidden', title: 'def-en', type: 'definition', reasoning: 'A fresh description' },\n});\nassert(duplicateHidden.some(error => error.includes('标题')));\nconst duplicateHiddenDescription = validateKnowledgeEdit(hiddenHistory, {\n  kind: 'add',\n  mode: 'atomic',\n  node: { id: 'duplicate-hidden-description', title: 'Fresh title', type: 'fact', reasoning: 'A prime has exactly two positive divisors' },\n});\nassert.deepEqual(duplicateHiddenDescription, []);")
          sub(tests,
              r"\n// A unified conclusion replaces source conclusions in every active downstream chain\..*?assert\.deepEqual\(downstreamMerged\.find\(item => item\.id === 'r-downstream'\)\?\.premises, \['c-unified'\]\);",
              '')

          # 8) Turn UI regression into a permanent no-zombie-merge guard.
          ui_test = 'src/ui/KnowledgeEditUiRegression.test.ts'
          replace(ui_test,
                  "const app = readFileSync('src/ui/app.ts', 'utf8');\n",
                  "const app = readFileSync('src/ui/app.ts', 'utf8');\nconst detail = readFileSync('src/ui/panels/NodeDetailController.ts', 'utf8');\nconst protocol = readFileSync('src/protocol/KnowledgeEditingProtocol.ts', 'utf8');\nconst events = readFileSync('src/event/Event.ts', 'utf8');\n")
          sub(ui_test,
              r"\nassert\(!panel\.includes\('id=\\\"mergeConclusionType\\\"'\).*?\n\nassert\(panel\.includes\('<option value=\\\"inner\\\">",
              "\n\nassert(panel.includes('<option value=\"inner\">")
          replace(ui_test,
                  "for (const action of ['openDecomposeForm', 'openDefinitionMergeForm', 'openTheoryMergeForm']) {\n  assert(panel.includes(action), `single controller is missing the ${action} flow`);\n}\n",
                  "assert(panel.includes('openDecomposeForm'), 'single controller is missing the decomposition flow');\n")
          for exact in [
              "assert(panel.includes('推理过程语义等价标识（先检查）'), 'theory merge must check reasoning identity before conclusion identity');\n",
              "assert(panel.includes('type: node.type'), 'theory merge must preserve the source fine type internally rather than ask the user');\n",
              "assert(panel.includes(\"return !['axiom', 'definition', 'fact', 'logic-symbol', 'reasoning'].includes(type)\"), 'reasoning nodes must not qualify for merge UI');\n",
          ]:
              replace(ui_test, exact, '')
          marker = "assert(panel.includes('original premise → step one → intermediate conclusion → step two → original conclusion')"
          # The file is Chinese here; insert the guard after the existing decomposition contract assertion instead.
          needle = "assert(panel.includes('原前提 → 步骤一 → 中间结论 → 步骤二 → 原结论'), 'decomposition UI must show the complete chain contract');\n"
          guard = needle + "for (const removed of ['MergeDefinitionPayload', 'MergeTheoryPayload', 'onMergeDefinitions', 'onMergeTheories', 'btnMerge', 'openMergeForm', 'openDefinitionMergeForm', 'openTheoryMergeForm', 'data-merge-source', 'submitMerge']) {\n  assert(!panel.includes(removed), `removed merge flow leaked into PanelController: ${removed}`);\n}\nassert(!app.includes('MergeEdit') && !app.includes(\"kind: 'merge'\"), 'application must not retain merge edit construction or wiring');\nassert(!detail.includes(\"| 'merge'\") && !detail.includes(\"merge: '合并'\"), 'node-detail edit menu must not retain merge as an action');\nassert(!protocol.includes('MergeEdit') && !protocol.includes(\"kind: 'merge'\"), 'active knowledge protocol must not retain merge variants');\nassert(!events.includes('KnowledgeMerged'), 'event model must not retain an unused KnowledgeMerged type');\n"
          replace(ui_test, needle, guard)

          # Sanity: active source tree must be free of the deleted feature identifiers.
          forbidden = [
              'MergeEdit','DefinitionMergeEdit','TheoryMergeEdit','KnowledgeMerged',
              'MergeDefinitionPayload','MergeTheoryPayload','btnMerge','openMergeForm',
              'openDefinitionMergeForm','openTheoryMergeForm','data-merge-source','submitMerge',
              'detail.actionMerge',
          ]
          for token in forbidden:
              hits=[]
              for source in Path('src').rglob('*'):
                  if source.is_file() and source.suffix in {'.ts','.tsx','.js','.mjs'}:
                      if token in source.read_text(errors='ignore'):
                          hits.append(str(source))
              assert not hits, f'forbidden merge token {token!r} remains in {hits}'
          PY
      - name: Build
        run: npm run build
      - name: Full tests
        run: npm test
      - name: I18n tests
        run: npm run test:i18n
      - name: Diff sanity
        run: |
          git diff --check
          git status --short
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts
          git commit -m "Remove edit merge flow and use one-second hold"
          git push origin HEAD:cleanup/remove-edit-merge-and-1s-hold
