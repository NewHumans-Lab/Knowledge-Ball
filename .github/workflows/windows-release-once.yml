name: Trigger Windows Release Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/windows-release-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch official Windows Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run windows-release.yml --ref main --repo "${{ github.repository }}"
