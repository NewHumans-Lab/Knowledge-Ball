name: Trigger reverse validation once

on:
  push:
    branches:
      - revert/pr26-label-spatial-anchor

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert/pr26-label-spatial-anchor
          fetch-depth: 0
      - name: Remove trigger file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/trigger-validate-once.yml
          git commit -m "Remove reverse validation trigger"
          git push origin HEAD:revert/pr26-label-spatial-anchor
