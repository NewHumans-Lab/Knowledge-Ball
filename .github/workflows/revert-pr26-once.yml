name: Revert PR 26 once

on:
  push:
    branches:
      - revert/pr26-label-spatial-anchor

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert/pr26-label-spatial-anchor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Revert PR 26 merge exactly
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert -m 1 --no-commit 2d7af6d090440ac5b53a9b167f386647d3e83c1a
          git rm .github/workflows/revert-pr26-once.yml
      - name: Install dependencies
        run: npm ci
      - name: Run scene regressions
        run: npm run test:scene
      - name: Build production bundle
        run: npm run build
      - name: Commit exact reverse
        shell: bash
        run: |
          git add -A
          git commit -m "Revert PR #26 label spatial anchors"
          git push origin HEAD:revert/pr26-label-spatial-anchor
