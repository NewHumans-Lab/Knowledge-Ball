name: Apply LQ-04 browser fixture convergence

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cache-knowledge-relations
          fetch-depth: 0
      - name: Apply browser fixture convergence
        run: python scripts/apply-lq04-browser-fixture.py
      - name: Restore validation workflow and commit correction
        run: |
          git show 0374d9e9b608d4d4745402017609e3f0ccdda178:.github/workflows/validate.yml > .github/workflows/validate.yml
          rm scripts/apply-lq04-browser-fixture.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Converge browser lineage fixture on render-generation authority"
          git push origin HEAD:fix/cache-knowledge-relations
