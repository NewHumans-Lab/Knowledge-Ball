name: Validate

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply solid relation-line patch
        if: github.event_name == 'push' && github.ref == 'refs/heads/style/solid-relation-lines' && !contains(github.event.head_commit.message, '[solid-lines-applied]')
        run: |
          python - <<'PY'
          from pathlib import Path

          theme = Path('src/ui/config/KnowledgeSceneTheme.ts')
          text = theme.read_text()
          replacements = {
            '    normalOpacity: 0.14,': '    normalOpacity: 1.00,',
            '    activeOpacity: 0.50,': '    activeOpacity: 1.00,',
            '    inactiveFactor: 0.18,': '    inactiveFactor: 1.00,',
            '    falsifiedOpacity: 0.06,': '    falsifiedOpacity: 1.00,',
            '    suspendedOpacity: 0.09,': '    suspendedOpacity: 1.00,',
            '    disputedOpacity: 0.18,': '    disputedOpacity: 1.00,',
            '    twinOpacity: 0.26,': '    twinOpacity: 1.00,',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'missing theme replacement: {old}')
            text = text.replace(old, new, 1)
          theme.write_text(text)

          scene = Path('src/ui/scene/KnowledgeScene.ts')
          text = scene.read_text()
          old = 'new THREE.LineBasicMaterial({ color: KNOWLEDGE_SCENE_THEME.edge.normal, transparent: true, opacity: KNOWLEDGE_SCENE_THEME.edge.normalOpacity })'
          new = 'new THREE.LineBasicMaterial({ color: KNOWLEDGE_SCENE_THEME.edge.normal, transparent: false, opacity: KNOWLEDGE_SCENE_THEME.edge.normalOpacity })'
          if old not in text:
            raise SystemExit('solid basic relation material insertion point not found')
          text = text.replace(old, new, 1)
          old = 'new THREE.LineDashedMaterial({ color: KNOWLEDGE_SCENE_THEME.edge.normal, transparent: true, opacity: KNOWLEDGE_SCENE_THEME.edge.twinOpacity, dashSize: 4, gapSize: 3 })'
          new = 'new THREE.LineDashedMaterial({ color: KNOWLEDGE_SCENE_THEME.edge.normal, transparent: false, opacity: KNOWLEDGE_SCENE_THEME.edge.twinOpacity, dashSize: 4, gapSize: 3 })'
          if old not in text:
            raise SystemExit('solid dashed relation material insertion point not found')
          scene.write_text(text.replace(old, new, 1))

          regression = Path('src/ui/scene/KnowledgeSceneRegression.test.ts')
          text = regression.read_text()
          old = "assert(KNOWLEDGE_SCENE_THEME.edge.normalOpacity<=.16,'ordinary relation lines must stay visually quiet');\nassert(KNOWLEDGE_SCENE_THEME.edge.activeOpacity>=.4,'selected relation paths must remain visibly distinguishable');"
          new = "assert(KNOWLEDGE_SCENE_THEME.edge.normalOpacity===1&&KNOWLEDGE_SCENE_THEME.edge.activeOpacity===1,'ordinary and selected relation lines must both remain fully opaque');\nassert(KNOWLEDGE_SCENE_THEME.edge.inactiveFactor===1,'selecting a node must not fade unrelated relation lines');\nassert(KNOWLEDGE_SCENE_THEME.edge.falsifiedOpacity===1&&KNOWLEDGE_SCENE_THEME.edge.suspendedOpacity===1&&KNOWLEDGE_SCENE_THEME.edge.disputedOpacity===1&&KNOWLEDGE_SCENE_THEME.edge.twinOpacity===1,'relation status and twin styling must not reintroduce transparency');"
          if old not in text:
            raise SystemExit('edge opacity regression block not found')
          text = text.replace(old, new, 1)
          marker = "const sceneSource=readFileSync('src/ui/scene/KnowledgeScene.ts','utf8');\n"
          addition = marker + "assert(sceneSource.includes('new THREE.LineBasicMaterial({ color: KNOWLEDGE_SCENE_THEME.edge.normal, transparent: false'),'ordinary relation material must be opaque');\nassert(sceneSource.includes('new THREE.LineDashedMaterial({ color: KNOWLEDGE_SCENE_THEME.edge.normal, transparent: false'),'twin relation material must be opaque');\n"
          if marker not in text:
            raise SystemExit('scene source regression marker not found')
          regression.write_text(text.replace(marker, addition, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/config/KnowledgeSceneTheme.ts src/ui/scene/KnowledgeScene.ts src/ui/scene/KnowledgeSceneRegression.test.ts
          git commit -m "[solid-lines-applied] Render relation lines fully opaque"
          git push origin HEAD:style/solid-relation-lines
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:pages
      - run: npm test
      - run: npm run test:download
      - name: Install Chromium for browser regressions
        run: npx playwright install --with-deps chromium
      - name: Verify cloud-only public state with two already-open real pages
        run: npm run test:browser-cloud
      - run: npm run test:browser-mobile
      - name: Upload mobile scene visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-scene-visual
          path: artifacts/mobile-scene-*.png
          if-no-files-found: warn
      - name: Run Issue 51 production-scale interaction trace
        run: npm run test:issue51-browser
      - name: Upload Issue 51 Playwright trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue51-playwright-trace
          path: artifacts/issue51-trace.zip
          if-no-files-found: warn
      - name: Verify pull request merges cleanly with its base
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          npm run test:merge -- "origin/${{ github.base_ref }}"

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - name: Run Android tests and build debug APK
        working-directory: android
        run: ./gradlew test assembleDebug

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ios:sync
      - name: Build iOS simulator app without signing
        working-directory: ios/App
        run: xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
