name: Apply LQ-03

on:
  push:
    branches:
      - fix/coalesce-projection-render

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/coalesce-projection-render
          fetch-depth: 0
      - name: Apply focused source patch
        run: python scripts/apply-lq03.py
      - name: Restore normal validation and commit
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/validate.yml
          git rm scripts/apply-lq03.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate.yml package.json scripts/verify-panel-style-path.mjs src/ui/app.ts src/ui/ProjectionRenderScheduler.ts src/ui/ProjectionRenderScheduler.test.ts src/ui/ProjectionRenderWiringRegression.test.ts
          git commit -m "Fix projection render amplification"
          git push origin HEAD:fix/coalesce-projection-render