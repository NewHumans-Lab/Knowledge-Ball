name: Apply LQ-04

on:
  push:
    branches:
      - fix/cache-knowledge-relations

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: run LQ-04 relation-index patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cache-knowledge-relations
          fetch-depth: 0
      - name: Apply focused relation-index patch
        run: python scripts/apply-lq04.py
      - name: Restore validation workflow and commit product changes
        run: |
          git show 0374d9e9b608d4d4745402017609e3f0ccdda178:.github/workflows/validate.yml > .github/workflows/validate.yml
          rm scripts/apply-lq04.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Cache canonical knowledge relations by graph generation"
          git push origin HEAD:fix/cache-knowledge-relations
