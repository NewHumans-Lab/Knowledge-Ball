name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/verify-seo.mjs
      - run: npm run test:pages
      - run: npm test
      - name: Verify deterministic reversible label budget
        run: npx esbuild src/ui/scene/StableShellLabelBudgetReversibility.test.ts --bundle --platform=node --format=esm --outfile=.test-dist/label-budget-reversibility.mjs && node .test-dist/label-budget-reversibility.mjs
      - run: npm run test:i18n
      - run: npm run test:download
      - name: Verify account onboarding migration semantics
        run: node scripts/verify-core-onboarding-migration.mjs
      - name: Validate Supabase release configuration without database writes
        run: node scripts/verify-supabase-schema.mjs
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Install Chromium for browser regressions
        run: npx playwright install --with-deps chromium
      - name: Verify zh-CN core labels are visibly above WebGL
        run: node scripts/verify-core-label-visibility-browser.mjs
      - name: Verify newcomer core onboarding in a real mobile browser
        run: node scripts/verify-core-onboarding-browser.mjs
      - name: Verify account onboarding sync across two browser devices
        run: node scripts/verify-core-onboarding-account-browser.mjs
      - name: Verify Settings downloads and zh-CN/en localization
        run: node scripts/verify-i18n-downloads-browser.mjs
      - name: Verify split standalone/reasoning creation on a real mobile page
        run: node scripts/verify-split-create-browser.mjs
      - name: Verify create errors remain visible above the new modal
        run: node scripts/verify-create-feedback-browser.mjs
      - name: Verify real-touch Current Personal All cycle on the built page
        run: node scripts/verify-visibility-mode-browser.mjs
      - name: Verify second-tap related-node navigation
        run: node scripts/verify-node-detail-relations-browser.mjs
      - name: Verify explicit panel exit ownership on a real mobile page
        run: node scripts/verify-panel-exit-browser.mjs
      - name: Verify cloud-only public state with two already-open real pages
        run: npm run test:browser-cloud
      - run: npm run test:browser-mobile
      - name: Verify label zoom-in/zoom-out reversibility on a real mobile page
        run: node scripts/verify-label-zoom-reversibility-browser.mjs
      - name: Upload mobile scene visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-scene-visual
          path: artifacts/mobile-scene-*.png
          if-no-files-found: warn
      - name: Run Issue 51 production-scale interaction trace
        run: npm run test:issue51-browser
      - name: Upload Issue 51 Playwright trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue51-playwright-trace
          path: artifacts/issue51-trace.zip
          if-no-files-found: warn
      - name: Verify branch merges cleanly with target base
        shell: bash
        run: |
          BASE_REF="${{ github.base_ref }}"
          if [ -z "$BASE_REF" ]; then BASE_REF="main"; fi
          git fetch origin "$BASE_REF"
          npm run test:merge -- "origin/$BASE_REF"

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
      - run: npm ci
      - run: npm test
      - name: Verify deterministic reversible label budget
        run: npx esbuild src/ui/scene/StableShellLabelBudgetReversibility.test.ts --bundle --platform=node --format=esm --outfile=.test-dist/label-budget-reversibility.mjs && node .test-dist/label-budget-reversibility.mjs
      - run: npm run test:i18n
      - name: Validate Android Supabase release configuration
        run: node scripts/verify-supabase-release-config.mjs
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Build and sync Android assets with production auth configuration
        run: npm run android:sync
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Run Android tests and build debug APK
        working-directory: android
        run: ./gradlew test assembleDebug

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify deterministic reversible label budget
        run: npx esbuild src/ui/scene/StableShellLabelBudgetReversibility.test.ts --bundle --platform=node --format=esm --outfile=.test-dist/label-budget-reversibility.mjs && node .test-dist/label-budget-reversibility.mjs
      - run: npm run test:i18n
      - run: npm run ios:sync
      - name: Build iOS simulator app without signing
        working-directory: ios/App
        run: xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
