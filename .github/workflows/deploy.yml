name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/downloads/latest.json'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - run: node scripts/verify-seo.mjs
      - run: npm run test:pages
      - run: npm test
      - run: npm run test:download
      - name: Validate Supabase release configuration without database writes
        run: node scripts/verify-supabase-schema.mjs
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed Pages site
        run: node scripts/verify-pages.mjs "${{ steps.deployment.outputs.page_url }}"
      - name: Install Chromium browser test
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Zero-write deployed Pages browser gate
        run: node scripts/verify-production-browser-zero-write.mjs "${{ steps.deployment.outputs.page_url }}" "${GITHUB_SHA}" "${{ vars.VITE_SUPABASE_URL }}"
