name: Android Signed Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - '!public/downloads/latest.json'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/android-release.yml'
      - '.github/scripts/verify-android-release.sh'
      - 'scripts/verify-supabase-release-config.mjs'

permissions:
  contents: write

concurrency:
  group: native-release-publication
  cancel-in-progress: false

env:
  ANDROID_API_LEVEL: '35'
  ANDROID_BUILD_TOOLS_VERSION: '35.0.0'
  ANDROID_EMULATOR_TARGET: google_apis
  ANDROID_EMULATOR_ARCH: x86_64
  ANDROID_EMULATOR_PROFILE: pixel_6

jobs:
  release-android:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - name: Compute authoritative Android release code
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_CODE=$((1000000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          if [ "$RELEASE_CODE" -gt 2147483647 ]; then
            echo "Android versionCode exceeds platform limit: $RELEASE_CODE" >&2
            exit 1
          fi
          echo "ANDROID_VERSION_CODE=$RELEASE_CODE" >> "$GITHUB_ENV"
          echo "APP_BUILD=$RELEASE_CODE" >> "$GITHUB_ENV"
          echo "Authoritative Android build/versionCode: $RELEASE_CODE"

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - uses: android-actions/setup-android@v3

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Install Android build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"
          echo "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS_VERSION}" >> "$GITHUB_PATH"

      - name: Require the authoritative signing identity
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required Android release secret: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/knowledge-ball-release.keystore"
          test -s "$RUNNER_TEMP/knowledge-ball-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/knowledge-ball-release.keystore" >> "$GITHUB_ENV"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate Supabase release configuration
        run: node scripts/verify-supabase-release-config.mjs
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Build and sync current main Web assets
        run: npm run android:sync
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Prove packaged asset parity
        run: node android/scripts/verify-packaged-assets.mjs

      - name: Inspect the authoritative published APK when one exists
        shell: bash
        run: |
          set -euo pipefail
          AVAILABLE=$(node -p "Boolean(require('./public/downloads/latest.json').platforms.android.available)")
          if [ "$AVAILABLE" != "true" ]; then
            echo "HAS_PUBLISHED_ANDROID=false" >> "$GITHUB_ENV"
            echo 'No authoritative Android APK is published yet; this run will establish the initial release signer.'
            exit 0
          fi
          URL=$(node -p "require('./public/downloads/latest.json').platforms.android.urls.download || ''")
          if [ -z "$URL" ]; then
            echo 'Android is marked available but has no authoritative download URL.' >&2
            exit 1
          fi
          curl --fail --location --retry 3 "$URL" --output "$RUNNER_TEMP/published.apk"
          apksigner verify --print-certs "$RUNNER_TEMP/published.apk" | tee "$RUNNER_TEMP/published-signing.txt"
          grep 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/published-signing.txt" | sed 's/.*: //' > "$RUNNER_TEMP/published-cert.sha256"
          test -s "$RUNNER_TEMP/published-cert.sha256"
          PUBLISHED_VERSION_CODE=$(aapt dump badging "$RUNNER_TEMP/published.apk" | sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p" | head -n1)
          test -n "$PUBLISHED_VERSION_CODE"
          echo "PUBLISHED_VERSION_CODE=$PUBLISHED_VERSION_CODE" >> "$GITHUB_ENV"
          echo "HAS_PUBLISHED_ANDROID=true" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify signature and strictly increasing versionCode
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          apksigner verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/new-signing.txt"
          grep 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/new-signing.txt" | sed 's/.*: //' > "$RUNNER_TEMP/new-cert.sha256"
          test -s "$RUNNER_TEMP/new-cert.sha256"
          NEW_VERSION_CODE=$(aapt dump badging "$APK" | sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p" | head -n1)
          test -n "$NEW_VERSION_CODE"
          test "$NEW_VERSION_CODE" = "$ANDROID_VERSION_CODE" || {
            echo "APK versionCode $NEW_VERSION_CODE does not match authoritative build $ANDROID_VERSION_CODE" >&2
            exit 1
          }
          if [ "${HAS_PUBLISHED_ANDROID:-false}" = "true" ]; then
            diff -u "$RUNNER_TEMP/published-cert.sha256" "$RUNNER_TEMP/new-cert.sha256" || {
              echo 'Refusing to publish: the new APK signer does not match the currently published APK, so in-place upgrades would fail.' >&2
              exit 1
            }
            if [ "$NEW_VERSION_CODE" -le "${PUBLISHED_VERSION_CODE}" ]; then
              echo "Refusing to publish non-upgrade APK: new versionCode $NEW_VERSION_CODE <= published $PUBLISHED_VERSION_CODE" >&2
              exit 1
            fi
          else
            echo 'Initial authoritative Android release: accepting the configured signer as the upgrade identity for future releases.'
          fi

      - name: Remove release keystore from runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            rm -f "$ANDROID_KEYSTORE_PATH"
          fi
          echo 'ANDROID_KEYSTORE_PATH=' >> "$GITHUB_ENV"

      - name: Restore Android emulator snapshot cache
        id: avd-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api${{ env.ANDROID_API_LEVEL }}-${{ env.ANDROID_EMULATOR_TARGET }}-${{ env.ANDROID_EMULATOR_ARCH }}-${{ env.ANDROID_EMULATOR_PROFILE }}-v1

      - name: Create clean Android emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_EMULATOR_TARGET }}
          arch: ${{ env.ANDROID_EMULATOR_ARCH }}
          profile: ${{ env.ANDROID_EMULATOR_PROFILE }}
          force-avd-creation: false
          disable-animations: false
          disable-linux-hw-accel: false
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo 'Created clean AVD snapshot for subsequent Android release runs.'

      - name: Save Android emulator snapshot cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd-cache.outputs.cache-primary-key }}

      - name: Install and launch the exact signed APK on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_EMULATOR_TARGET }}
          arch: ${{ env.ANDROID_EMULATOR_ARCH }}
          profile: ${{ env.ANDROID_EMULATOR_PROFILE }}
          force-avd-creation: false
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 300
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/verify-android-release.sh

      - name: Prepare immutable release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          BUILD="$ANDROID_VERSION_CODE"
          COMMIT="$GITHUB_SHA"
          NAME="Knowledge-Ball-Android-v${VERSION}-b${BUILD}.apk"
          META="android-release-b${BUILD}.json"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          SHA=$(sha256sum "$NAME" | awk '{print $1}')
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${NAME}"
          cat > "$META" <<JSON
          {
            "platform": "android",
            "available": true,
            "distribution": "apk",
            "version": "${VERSION}",
            "build": "${BUILD}",
            "commit": "${COMMIT}",
            "urls": { "download": "${URL}" },
            "checksum": "sha256:${SHA}"
          }
          JSON
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "asset=$NAME" >> "$GITHUB_OUTPUT"
          echo "metadata=$META" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Publish immutable signed APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          ASSET: ${{ steps.metadata.outputs.asset }}
          META: ${{ steps.metadata.outputs.metadata }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "v${VERSION}" >/dev/null 2>&1 || gh release create "v${VERSION}" --title "Knowledge Ball v${VERSION}" --notes "Platform release artifacts for Knowledge Ball v${VERSION}."
          if gh release view "v${VERSION}" --json assets --jq '.assets[].name' | grep -Fxq "$ASSET"; then
            echo "Refusing to overwrite immutable APK asset: $ASSET" >&2
            exit 1
          fi
          gh release upload "v${VERSION}" "$ASSET" "$META"

      - name: Verify the published APK is byte-identical
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          ASSET: ${{ steps.metadata.outputs.asset }}
          EXPECTED_SHA: ${{ steps.metadata.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-verify"
          gh release download "v${VERSION}" --pattern "$ASSET" --dir "$RUNNER_TEMP/release-verify"
          ACTUAL_SHA=$(sha256sum "$RUNNER_TEMP/release-verify/$ASSET" | awk '{print $1}')
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Publish Android availability to the Pages manifest
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          META: ${{ steps.metadata.outputs.metadata }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$META" "$RUNNER_TEMP/android-release.json"
          git reset --hard "$GITHUB_SHA"
          git fetch origin main
          git checkout -B main origin/main
          node scripts/update-release-manifest.mjs android "$RUNNER_TEMP/android-release.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/latest.json
          if git diff --cached --quiet; then
            echo 'Android release manifest is already current.'
          else
            git commit -m "Publish Android release v${VERSION} build ${ANDROID_VERSION_CODE}"
            git push origin HEAD:main
          fi

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-signed-release-evidence
          path: |
            artifacts/android-release
            android-release-b*.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
