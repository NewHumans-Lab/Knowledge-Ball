name: Android Runtime Gate

on:
  push:
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/validate.yml'
      - '.github/workflows/android-runtime.yml'
      - '.github/workflows/windows-runtime.yml'

permissions:
  contents: read

jobs:
  android-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
      - name: Install Android SDK and emulator image
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;google_apis;x86_64"
      - run: npm ci
      - name: Build and sync the authoritative Web product into Android
        run: npm run android:sync
      - name: Verify deterministic reversible label budget
        run: npx esbuild src/ui/scene/StableShellLabelBudgetReversibility.test.ts --bundle --platform=node --format=esm --outfile=.test-dist/label-budget-reversibility.mjs && node .test-dist/label-budget-reversibility.mjs
      - name: Prove packaged Web assets match the native WebView payload
        run: node android/scripts/verify-packaged-assets.mjs
      - name: Run Android emulator instrumentation acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: >-
            bash -lc 'set -euxo pipefail;
            mkdir -p artifacts/android;
            adb wait-for-device;
            adb shell settings put global hide_error_dialogs 1 || true;
            adb shell am force-stop com.google.android.apps.nexuslauncher || true;
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true;
            adb shell input keyevent KEYCODE_BACK || true;
            sleep 1;
            cd android;
            test_status=0;
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --stacktrace > ../artifacts/android/gradle-connected-test.log 2>&1 || test_status=$?;
            mkdir -p ../artifacts/android/test-results ../artifacts/android/test-report;
            cp -R app/build/outputs/androidTest-results/connected/. ../artifacts/android/test-results/ 2>/dev/null || true;
            cp -R app/build/reports/androidTests/connected/. ../artifacts/android/test-report/ 2>/dev/null || true;
            adb logcat -d > ../artifacts/android/logcat.txt 2>&1 || true;
            adb shell dumpsys activity activities > ../artifacts/android/activity-dump.txt 2>&1 || true;
            adb shell dumpsys window windows > ../artifacts/android/window-dump.txt 2>&1 || true;
            adb shell dumpsys package org.knowledgeball.app > ../artifacts/android/package-dump.txt 2>&1 || true;
            adb exec-out screencap -p > ../artifacts/android/runtime-final.png 2>/dev/null || true;
            if [ "$test_status" -ne 0 ]; then cat ../artifacts/android/gradle-connected-test.log; exit "$test_status"; fi;
            cd ..;
            grep -E "versionName=|versionCode=" artifacts/android/package-dump.txt > artifacts/android/package-identity.txt;
            adb pull /sdcard/Android/data/org.knowledgeball.app/files/Pictures/knowledge-ball-android.png artifacts/android/knowledge-ball-android.png;
            test -s artifacts/android/knowledge-ball-android.png'
      - name: Upload Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-evidence
          path: artifacts/android
          if-no-files-found: error
