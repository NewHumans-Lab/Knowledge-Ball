name: Temporary screen-space label refactor

on:
  push:
    branches:
      - fix/screen-space-label-geometry

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[screen-space-label-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply refactor
        run: node scripts/apply-screen-space-label-refactor.mjs
      - run: npm ci
      - name: Run focused scene regressions
        run: npm run test:scene
      - name: Build production bundle
        run: npm run build
      - name: Install Chromium for focused browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Verify visible core labels
        run: node scripts/verify-core-label-visibility-browser.mjs
      - name: Verify mobile label and scene behavior
        run: node scripts/verify-mobile-browser.mjs
      - name: Commit only after focused acceptance passes
        run: |
          rm scripts/apply-screen-space-label-refactor.mjs
          rm .github/workflows/temp-screen-space-label-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/scene/KnowledgeScene.ts src/ui/scene/NodeScreenGeometry.ts src/ui/scene/KnowledgeSceneRegression.test.ts scripts/apply-screen-space-label-refactor.mjs .github/workflows/temp-screen-space-label-refactor.yml
          git diff --cached --exit-code && { echo 'No refactor changes produced'; exit 1; } || true
          git commit -m "fix: anchor labels in screen space [screen-space-label-applied]"
          git push origin HEAD:fix/screen-space-label-geometry
