name: Apply LQ-10 create ownership

on:
  push:
    branches:
      - fix/lq08-12-convergence

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lq08-12-convergence
      - name: Apply LQ-10 create ownership isolation
        env:
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$ACTOR" = "github-actions[bot]" ]; then
            exit 0
          fi
          python3 scripts/apply-lq10-create-ownership.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/app.ts src/ui/panels/PanelController.ts scripts/verify-create-ownership.mjs package.json
          git commit -m "Isolate legacy create to native compatibility"
          git push origin HEAD:fix/lq08-12-convergence
