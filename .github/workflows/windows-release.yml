name: Windows Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-release-publication
  cancel-in-progress: false

jobs:
  release-windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build authoritative Web product
        shell: pwsh
        run: |
          npm ci
          npm run build
      - name: Install Windows shell dependencies
        working-directory: windows
        run: npm ci
      - name: Sync package version from root identity
        working-directory: windows
        shell: pwsh
        run: |
          $version = node -p "require('../package.json').version"
          npm pkg set "version=$version"
      - name: Package Windows installer and portable app
        working-directory: windows
        run: npm run package
      - name: Verify packaged assets and exact EXE runtime
        working-directory: windows
        shell: pwsh
        run: |
          npm run test:assets
          npm run test:runtime
      - name: Prepare release artifacts and metadata
        id: metadata
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $setupSource = Get-ChildItem windows/release -Filter '*nsis*.exe' | Select-Object -First 1
          $portableSource = Get-ChildItem windows/release -Filter '*portable*.exe' | Select-Object -First 1
          if (-not $setupSource -or -not $portableSource) { throw 'Expected NSIS and portable EXEs were not produced.' }
          $setupName = "Knowledge-Ball-Windows-Setup-v$version.exe"
          $portableName = "Knowledge-Ball-Windows-Portable-v$version.exe"
          Copy-Item $setupSource.FullName $setupName
          Copy-Item $portableSource.FullName $portableName
          $setupHash = (Get-FileHash $setupName -Algorithm SHA256).Hash.ToLower()
          $portableHash = (Get-FileHash $portableName -Algorithm SHA256).Hash.ToLower()
          $setupSignature = (Get-AuthenticodeSignature $setupName).Status.ToString()
          $portableSignature = (Get-AuthenticodeSignature $portableName).Status.ToString()
          $repo = $env:GITHUB_REPOSITORY
          $commit = $env:GITHUB_SHA
          $build = $env:GITHUB_RUN_NUMBER
          $setupUrl = "https://github.com/$repo/releases/download/v$version/$setupName"
          $portableUrl = "https://github.com/$repo/releases/download/v$version/$portableName"
          $manifest = [ordered]@{
            platform = 'windows'
            available = $true
            distribution = 'installer'
            version = $version
            build = $build
            commit = $commit
            urls = [ordered]@{
              installer = $setupUrl
              portable = $portableUrl
            }
            checksum = "sha256:$setupHash"
            checksums = [ordered]@{
              installer = "sha256:$setupHash"
              portable = "sha256:$portableHash"
            }
            authenticode = [ordered]@{
              installer = $setupSignature
              portable = $portableSignature
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 windows-release.json
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "setup=$setupName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "portable=$portableName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "setup_sha=$setupHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "portable_sha=$portableHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Publish Windows artifacts to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          SETUP: ${{ steps.metadata.outputs.setup }}
          PORTABLE: ${{ steps.metadata.outputs.portable }}
        shell: pwsh
        run: |
          gh release view "v$env:VERSION" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "v$env:VERSION" --title "Knowledge Ball v$env:VERSION" --notes "Platform release artifacts for Knowledge Ball v$env:VERSION."
          }
          gh release upload "v$env:VERSION" "$env:SETUP" "$env:PORTABLE" windows-release.json --clobber
      - name: Verify the published EXEs are byte-identical
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          SETUP: ${{ steps.metadata.outputs.setup }}
          PORTABLE: ${{ steps.metadata.outputs.portable }}
          SETUP_SHA: ${{ steps.metadata.outputs.setup_sha }}
          PORTABLE_SHA: ${{ steps.metadata.outputs.portable_sha }}
        shell: pwsh
        run: |
          $verifyDir = Join-Path $env:RUNNER_TEMP 'release-verify'
          New-Item -ItemType Directory -Path $verifyDir -Force | Out-Null
          gh release download "v$env:VERSION" --pattern "$env:SETUP" --pattern "$env:PORTABLE" --dir $verifyDir
          $setupActual = (Get-FileHash (Join-Path $verifyDir $env:SETUP) -Algorithm SHA256).Hash.ToLower()
          $portableActual = (Get-FileHash (Join-Path $verifyDir $env:PORTABLE) -Algorithm SHA256).Hash.ToLower()
          if ($setupActual -ne $env:SETUP_SHA) { throw 'Published Windows installer checksum does not match the tested artifact.' }
          if ($portableActual -ne $env:PORTABLE_SHA) { throw 'Published Windows portable checksum does not match the tested artifact.' }
      - name: Publish Windows availability to the Pages manifest
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: pwsh
        run: |
          $fragment = Join-Path $env:RUNNER_TEMP 'windows-release.json'
          Copy-Item windows-release.json $fragment -Force
          git reset --hard $env:GITHUB_SHA
          git fetch origin main
          git checkout -B main origin/main
          node scripts/update-release-manifest.mjs windows $fragment
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Windows release manifest is already current.'
          } else {
            git commit -m "Publish Windows release v$env:VERSION"
            git push origin HEAD:main
          }
      - name: Upload Windows release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-evidence
          path: |
            windows/artifacts
            windows-release.json
          if-no-files-found: warn
