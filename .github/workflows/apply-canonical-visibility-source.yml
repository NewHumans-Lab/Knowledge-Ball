name: Apply canonical visibility source

on:
  push:
    branches:
      - fix/canonical-visibility-source

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-visibility-source
      - name: Apply canonical visibility source
        env:
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$ACTOR" = "github-actions[bot]" ]; then
            exit 0
          fi
          python3 scripts/apply-canonical-visibility-source.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html vite.config.ts scripts/verify-visibility-runtime-architecture.mjs
          git commit -m "Make visibility shell canonical in source HTML"
          git push origin HEAD:fix/canonical-visibility-source
