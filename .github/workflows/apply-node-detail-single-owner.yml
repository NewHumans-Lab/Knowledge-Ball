name: Apply NodeDetail single owner

on:
  push:
    branches:
      - fix/node-detail-single-owner

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/node-detail-single-owner
      - name: Apply NodeDetail ownership refactor
        env:
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$ACTOR" = "github-actions[bot]" ]; then
            exit 0
          fi
          python3 scripts/apply-node-detail-single-owner.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/panels/NodeDetailController.ts src/ui/panels/NodeDetailLineageUi.ts src/ui/panels/NodeDetailRegression.test.ts src/ui/app.ts scripts/verify-lineage-spec-convergence.mjs scripts/verify-lineage-v3-final-hardening.mjs
          git commit -m "Make NodeDetailController the sole detail interaction owner"
          git push origin HEAD:fix/node-detail-single-owner
