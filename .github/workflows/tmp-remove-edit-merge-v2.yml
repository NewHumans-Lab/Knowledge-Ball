name: Temporary remove edit merge v2

on:
  push:
    branches: [cleanup/remove-edit-merge-and-1s-hold]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-edit-merge-and-1s-hold
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply corrected cleanup codemod
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          raw = Path('.github/workflows/tmp-remove-edit-merge.yml').read_text()
          begin_token = "          python3 <<'PY'\n"
          end_token = "\n          PY\n"
          start = raw.index(begin_token) + len(begin_token)
          end = raw.index(end_token, start)
          script = textwrap.dedent(raw[start:end])
          lines = script.splitlines()
          out = []
          i = 0
          removed = False
          while i < len(lines):
              if lines[i].strip() == 'sub(ui_test,' and i + 1 < len(lines) and 'mergeConclusionType' in lines[i + 1]:
                  # Keep the existing negative regression assertion; only skip the attempted rewrite of it.
                  i += 3
                  removed = True
                  continue
              out.append(lines[i])
              i += 1
          assert removed, 'expected faulty mergeConclusionType rewrite was not found'
          Path('/tmp/remove-edit-merge.py').write_text('\n'.join(out) + '\n')
          PY
          python3 /tmp/remove-edit-merge.py
      - name: Build
        run: npm run build
      - name: Full tests
        run: npm test
      - name: I18n tests
        run: npm run test:i18n
      - name: Diff sanity
        run: |
          git diff --check
          git status --short
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts
          git commit -m "Remove edit merge flow and use one-second hold"
          git push origin HEAD:cleanup/remove-edit-merge-and-1s-hold
