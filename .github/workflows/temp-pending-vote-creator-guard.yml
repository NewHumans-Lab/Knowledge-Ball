name: temp-pending-vote-creator-guard
on:
  push:
    branches:
      - fix/pending-vote-creator-guard
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pending-vote-creator-guard
      - name: Apply exact creator-vote UI guard
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:80]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'expected one match in {path}, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/ui/app.ts',
              "return metadata ? { contributor: metadata.contributor, createdAt: metadata.createdAt } : null;",
              "return metadata ? { contributor: metadata.contributor, createdAt: metadata.createdAt, actorId: metadata.actorId } : null;",
          )

          replace_once(
              'src/ui/panels/NodeDetailController.ts',
              "export interface NodeDetailMetadata {\n  contributor: string;\n  createdAt: string;\n}",
              "export interface NodeDetailMetadata {\n  contributor: string;\n  createdAt: string;\n  actorId: string;\n}",
          )
          replace_once(
              'src/ui/panels/NodeDetailController.ts',
              '<button type="button" class="node-detail-vote-button agree" data-vote-side="AGREE"><span>同意</span><small>能量 −1</small></button>',
              '<button type="button" class="node-detail-vote-button agree" data-vote-side="AGREE" disabled><span>同意</span><small>能量 −1</small></button>',
          )
          replace_once(
              'src/ui/panels/NodeDetailController.ts',
              '<button type="button" class="node-detail-vote-button disagree" data-vote-side="DISAGREE"><span>反对</span><small>能量 −1</small></button>',
              '<button type="button" class="node-detail-vote-button disagree" data-vote-side="DISAGREE" disabled><span>反对</span><small>能量 −1</small></button>',
          )
          replace_once(
              'src/ui/panels/NodeDetailController.ts',
              "    this.root.dataset.nodeId = node.id;\n    this.root.innerHTML = `",
              "    this.root.dataset.nodeId = node.id;\n    delete this.root.dataset.voteCreator;\n    this.root.innerHTML = `",
          )
          replace_once(
              'src/ui/panels/NodeDetailController.ts',
              "      this.bindPendingVote(node.id, token, account);",
              "      void this.bindPendingVote(node.id, token, account, metadata?.actorId);",
          )
          replace_once(
              'src/ui/panels/NodeDetailController.ts',
              "  private bindPendingVote(\n    nodeId: string,\n    token: number,\n    account: ReturnType<typeof createProductionAuthClient>,\n  ): void {\n    const buttons = Array.from(this.root.querySelectorAll<HTMLButtonElement>('[data-vote-side]'));\n    if (!account) {\n      buttons.forEach(button => { button.disabled = true; });\n      return;\n    }\n    buttons.forEach(button => button.addEventListener('click', () => {\n      const side = button.dataset.voteSide as PendingVoteSide | undefined;\n      if (side === 'AGREE' || side === 'DISAGREE') void this.castPendingVote(nodeId, side, token);\n    }));\n    void this.refreshPendingVote(nodeId, token);\n  }",
              "  private async bindPendingVote(\n    nodeId: string,\n    token: number,\n    account: ReturnType<typeof createProductionAuthClient>,\n    creatorActorId: string | undefined,\n  ): Promise<void> {\n    const buttons = Array.from(this.root.querySelectorAll<HTMLButtonElement>('[data-vote-side]'));\n    if (!account) {\n      buttons.forEach(button => { button.disabled = true; });\n      return;\n    }\n\n    if (creatorActorId) {\n      try {\n        const actorId = await account.currentUserId();\n        if (!this.isCurrentVote(nodeId, token)) return;\n        if (actorId === creatorActorId) this.root.dataset.voteCreator = '1';\n      } catch {\n        if (!this.isCurrentVote(nodeId, token)) return;\n        const status = this.root.querySelector<HTMLElement>('.node-detail-vote-status');\n        if (status) status.textContent = '身份确认失败，暂不能投票';\n        return;\n      }\n    }\n\n    if (this.root.dataset.voteCreator !== '1') {\n      buttons.forEach(button => button.addEventListener('click', () => {\n        const side = button.dataset.voteSide as PendingVoteSide | undefined;\n        if (side === 'AGREE' || side === 'DISAGREE') void this.castPendingVote(nodeId, side, token);\n      }));\n    }\n    await this.refreshPendingVote(nodeId, token);\n  }",
          )
          replace_once(
              'src/ui/panels/NodeDetailController.ts',
              "      button.disabled = !open || snapshot.mySide !== null;",
              "      button.disabled = !open || snapshot.mySide !== null || this.root.dataset.voteCreator === '1';",
          )
          replace_once(
              'src/ui/panels/NodeDetailController.ts',
              "    if (!open) {\n      const reason = snapshot.closeReason === 'TIMEOUT' ? '时间到期' : '达到票数';",
              "    if (!open) {\n      const reason = snapshot.closeReason === 'TIMEOUT' ? '时间到期' : '达到票数';",
          )
          replace_once(
              'src/ui/panels/NodeDetailController.ts',
              "      return;\n    }\n    if (snapshot.mySide) {",
              "      return;\n    }\n    if (this.root.dataset.voteCreator === '1') {\n      status.textContent = `你是该知识的提交者，不能参与本轮投票 · ${tally}`;\n      return;\n    }\n    if (snapshot.mySide) {",
          )

          test = Path('src/ui/panels/NodeDetailRegression.test.ts')
          text = test.read_text()
          marker = "assert(detail.includes('VOTE_REFRESH_MS = 3_000'), 'near-node vote tally must retain the existing prompt refresh cadence');\n"
          addition = marker + "assert(app.includes('actorId: metadata.actorId'), 'near-node detail must receive the authoritative creator actor id');\nassert(detail.includes('await account.currentUserId()'), 'pending detail must compare the current account with the node creator');\nassert(detail.includes(\"this.root.dataset.voteCreator = '1'\"), 'creator identity must lock the pending vote controls');\nassert(detail.includes('你是该知识的提交者，不能参与本轮投票'), 'creator must see an explicit no-self-vote explanation');\nassert(detail.includes('data-vote-side=\"AGREE\" disabled') && detail.includes('data-vote-side=\"DISAGREE\" disabled'), 'vote buttons must stay disabled until identity and server state are known');\n"
          if marker not in text:
              raise SystemExit('node detail regression insertion marker missing')
          if 'authoritative creator actor id' not in text:
              test.write_text(text.replace(marker, addition, 1))

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ui/app.ts src/ui/panels/NodeDetailController.ts src/ui/panels/NodeDetailRegression.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Guard pending votes from claim creators"
          git push origin HEAD:fix/pending-vote-creator-guard
