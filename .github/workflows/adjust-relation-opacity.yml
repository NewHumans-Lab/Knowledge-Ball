# trigger
name: Adjust relation opacity

on:
  push:
    branches:
      - style/half-opacity-relation-lines

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[relation-opacity-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply half-opacity relation styling
        run: |
          python - <<'PY'
          from pathlib import Path

          theme = Path('src/ui/config/KnowledgeSceneTheme.ts')
          text = theme.read_text()
          replacements = {
            '    normalOpacity: 1.00,': '    normalOpacity: 0.50,',
            '    activeOpacity: 1.00,': '    activeOpacity: 0.50,',
            '    falsifiedOpacity: 1.00,': '    falsifiedOpacity: 0.50,',
            '    suspendedOpacity: 1.00,': '    suspendedOpacity: 0.50,',
            '    disputedOpacity: 1.00,': '    disputedOpacity: 0.50,',
            '    twinOpacity: 1.00,': '    twinOpacity: 0.50,',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'missing theme replacement: {old}')
            text = text.replace(old, new, 1)
          theme.write_text(text)

          scene = Path('src/ui/scene/KnowledgeScene.ts')
          text = scene.read_text()
          old = 'new THREE.LineBasicMaterial({ color: KNOWLEDGE_SCENE_THEME.edge.normal, transparent: false, opacity: KNOWLEDGE_SCENE_THEME.edge.normalOpacity })'
          new = 'new THREE.LineBasicMaterial({ color: KNOWLEDGE_SCENE_THEME.edge.normal, transparent: true, opacity: KNOWLEDGE_SCENE_THEME.edge.normalOpacity })'
          if old not in text:
            raise SystemExit('basic relation material insertion point not found')
          text = text.replace(old, new, 1)
          old = 'new THREE.LineDashedMaterial({ color: KNOWLEDGE_SCENE_THEME.edge.normal, transparent: false, opacity: KNOWLEDGE_SCENE_THEME.edge.twinOpacity, dashSize: 4, gapSize: 3 })'
          new = 'new THREE.LineDashedMaterial({ color: KNOWLEDGE_SCENE_THEME.edge.normal, transparent: true, opacity: KNOWLEDGE_SCENE_THEME.edge.twinOpacity, dashSize: 4, gapSize: 3 })'
          if old not in text:
            raise SystemExit('dashed relation material insertion point not found')
          scene.write_text(text.replace(old, new, 1))

          regression = Path('src/ui/scene/KnowledgeSceneRegression.test.ts')
          text = regression.read_text()
          old = "assert(KNOWLEDGE_SCENE_THEME.edge.normalOpacity===1&&KNOWLEDGE_SCENE_THEME.edge.activeOpacity===1,'ordinary and selected relation lines must both remain fully opaque');\nassert(KNOWLEDGE_SCENE_THEME.edge.inactiveFactor===1,'selecting a node must not fade unrelated relation lines');\nassert(KNOWLEDGE_SCENE_THEME.edge.falsifiedOpacity===1&&KNOWLEDGE_SCENE_THEME.edge.suspendedOpacity===1&&KNOWLEDGE_SCENE_THEME.edge.disputedOpacity===1&&KNOWLEDGE_SCENE_THEME.edge.twinOpacity===1,'relation status and twin styling must not reintroduce transparency');"
          new = "assert(KNOWLEDGE_SCENE_THEME.edge.normalOpacity===.5&&KNOWLEDGE_SCENE_THEME.edge.activeOpacity===.5,'ordinary and selected relation lines must keep the same 0.5 opacity so selection changes color only');\nassert(KNOWLEDGE_SCENE_THEME.edge.inactiveFactor===1,'selecting a node must not fade unrelated relation lines');\nassert(KNOWLEDGE_SCENE_THEME.edge.falsifiedOpacity===.5&&KNOWLEDGE_SCENE_THEME.edge.suspendedOpacity===.5&&KNOWLEDGE_SCENE_THEME.edge.disputedOpacity===.5&&KNOWLEDGE_SCENE_THEME.edge.twinOpacity===.5,'relation status and twin styling must not introduce a second opacity level');"
          if old not in text:
            raise SystemExit('edge opacity regression block not found')
          text = text.replace(old, new, 1)
          text = text.replace("assert(sceneSource.includes('new THREE.LineBasicMaterial({ color: KNOWLEDGE_SCENE_THEME.edge.normal, transparent: false'),'ordinary relation material must be opaque');", "assert(sceneSource.includes('new THREE.LineBasicMaterial({ color: KNOWLEDGE_SCENE_THEME.edge.normal, transparent: true'),'ordinary relation material must support the fixed 0.5 opacity');", 1)
          text = text.replace("assert(sceneSource.includes('new THREE.LineDashedMaterial({ color: KNOWLEDGE_SCENE_THEME.edge.normal, transparent: false'),'twin relation material must be opaque');", "assert(sceneSource.includes('new THREE.LineDashedMaterial({ color: KNOWLEDGE_SCENE_THEME.edge.normal, transparent: true'),'twin relation material must support the fixed 0.5 opacity');", 1)
          regression.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/config/KnowledgeSceneTheme.ts src/ui/scene/KnowledgeScene.ts src/ui/scene/KnowledgeSceneRegression.test.ts
          git commit -m "[relation-opacity-applied] Tune relation lines to 0.5 opacity"
          git push origin HEAD:style/half-opacity-relation-lines
