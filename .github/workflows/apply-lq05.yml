name: Apply LQ-05 product patch

on:
  push:
    branches:
      - fix/explicit-panel-exit-ownership

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/explicit-panel-exit-ownership
          fetch-depth: 0
      - name: Apply product patch only
        run: |
          python3 scripts/apply-lq05.py
          rm scripts/apply-lq05.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace exit UI monkeypatch with explicit panel navigation"
          git push origin HEAD:fix/explicit-panel-exit-ownership
