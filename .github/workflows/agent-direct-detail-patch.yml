name: Apply direct-detail patch

on:
  push:
    branches:
      - fix/direct-detail-personal-visibility

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden scoped patch matcher
        run: node scripts/.agent-fix-direct-detail-patch.mjs

      - name: Apply scoped patch
        run: node scripts/.agent-direct-detail-personal-visibility.mjs

      - name: Remove one-shot patch scripts and restore CI workflow
        run: |
          rm scripts/.agent-direct-detail-personal-visibility.mjs
          rm scripts/.agent-fix-direct-detail-patch.mjs
          git restore --source=HEAD -- .github/workflows/validate.yml

      - name: Commit product changes atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix direct detail interaction and personal visibility"
          git push origin HEAD:${GITHUB_REF_NAME}
