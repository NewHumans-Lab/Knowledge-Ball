import { readFile } from 'node:fs/promises';

const dag = await readFile('supabase/migrations/202608220005_dependency_dag_projection.sql', 'utf8');
const baseCascade = await readFile('supabase/migrations/202608220006_current_change_cascade.sql', 'utf8');
const cascade = await readFile('supabase/migrations/202608220008_cascade_revalidation_rounds.sql', 'utf8');

assert.match(dag, /create table private\.knowledge_dependency_edges/);
assert.match(dag, /primary key \(premise_node_id, conclusion_node_id\)/);
assert.match(dag, /knowledge dependency graph must remain acyclic/);
assert.match(dag, /with recursive downstream\(node_id\)/);
assert.match(dag, /order by sequence, event_id/);
assert.doesNotMatch(dag, /order by seq, event_id/);
assert.match(dag, /create trigger project_knowledge_dependency_event/);
assert.doesNotMatch(dag, /topic_id|lineage_role|opposition_rank|history_rank/i);
for (const eventType of ['NodeCreated','NodeEdited','KnowledgeAdded','KnowledgeNodeEdited','KnowledgeNegated','KnowledgeDecomposed','KnowledgeMerged']) {
  assert.ok(dag.includes(`event_type_value = '${eventType}'`), `${eventType} must be covered by dependency replay`);
}
assert.match(dag, /payload,optimization[\s\S]*where conclusion_node_id = target_id/);
assert.match(dag, /payload,opposition[\s\S]*where conclusion_node_id = target_id/);
assert.match(dag, /repoint_dependency_sources/);

// 006 is retained only as the already-deployed traversal trigger base; 008 must replace its reduced disputed-only effect.
assert.match(baseCascade, /with recursive downstream\(node_id\)/);
assert.match(baseCascade, /KnowledgeVerdictFinalized/);
assert.match(baseCascade, /KnowledgeRevalidationFinalized/);

assert.match(cascade, /round_kind in \('INITIAL','CASCADE'\)/);
assert.match(cascade, /initiator_id drop not null/);
assert.match(cascade, /initiator_side drop not null/);
assert.match(cascade, /knowledge_pending_votes_round_id_voter_id_key unique\(round_id,voter_id\)/i);
assert.match(cascade, /start_cascade_knowledge_revalidation/);
assert.match(cascade, /'kind','cascade'/);
assert.match(cascade, /'type','KnowledgeRevalidationStarted'/);
assert.doesNotMatch(cascade, /'status','pending'/, 'cascade start must use a server-only lifecycle event, not a client-writable status command');
assert.match(cascade, /720 hours/);
assert.match(cascade, /if agree_count=disagree_count then[\s\S]*'PENDING'/);
assert.match(cascade, /round_row\.round_kind='CASCADE'[\s\S]*'ORDINARY_ONLY'/);
assert.match(cascade, /stake_amount numeric\(30,6\):=1\.000000/);
assert.match(cascade, /round_row\.round_kind='INITIAL' and round_row\.initiator_id=actor/);
assert.match(cascade, /'roundKind',round_row\.round_kind/);
assert.match(cascade, /case when decided_verdict='CORRECT' then 'verified' else 'suspended' end/);
assert.doesNotMatch(cascade, /case when decided_verdict='CORRECT' then 'verified' else 'falsified' end/);

// Traverse current descendants only, recursively and once; lineage history/opposition never become DAG bridges.
assert.match(cascade, /lm\.role='current'/g);
assert.match(cascade, /with recursive downstream\(node_id\)/);
assert.match(cascade, /\n\s*union\n/);
assert.match(cascade, /where node_id<>new_current_id/);
assert.match(cascade, /order by node_id/);
const startIndex=cascade.indexOf('start_cascade_knowledge_revalidation');
const repointIndex=cascade.indexOf('perform private.repoint_dependency_sources');
assert.ok(startIndex>=0 && repointIndex>startIndex, 'dependency source repoint must occur after cascade targets are discovered');

// Current-version changes that can propagate remain exactly optimization/opposition/human old-ball reactivation.
assert.match(cascade, /KnowledgeVerdictFinalized/);
assert.match(cascade, /proposal_kind in\('optimization','opposition'\)/);
assert.match(cascade, /KnowledgeRevalidationFinalized/);
assert.match(cascade, /role_at_start_value='history'/);
assert.match(cascade, /role_at_start_value='opposition'/);
assert.match(cascade, /policyVersion.*ORIGINAL_DESIGN_V1/);

// A cascade verdict itself must not be interpreted as another head change or historical viewpoint flip.
assert.match(cascade, /new\.envelope#>>'\{payload,policyVersion\}'='ORIGINAL_DESIGN_V1' then return new/);

// Human head changes are blocked while the current ball of that topic is in an open cascade round.
assert.match(cascade, /knowledge topic current head is under cascade revalidation/);

function currentDownstream(edges,currentIds,start){
  const current=new Set(currentIds),visited=new Set(),queue=[start];
  while(queue.length){const source=queue.shift();for(const [from,to] of edges){if(from!==source||!current.has(to)||visited.has(to))continue;visited.add(to);queue.push(to);}}
  visited.delete(start);return [...visited].sort();
}
assert.deepEqual(currentDownstream([['A1','B'],['B','C'],['C','D'],['B','D']],['A2','B','C','D'],'A1'),['B','C','D']);
assert.deepEqual(currentDownstream([['A1','B-old'],['B-old','C'],['A1','B-current'],['B-current','C']],['A2','B-current','C'],'A1'),['B-current','C']);
console.log('Knowledge Lineage automatic cascade lifecycle checks passed');
''')

