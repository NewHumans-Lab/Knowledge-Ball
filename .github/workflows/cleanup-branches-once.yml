name: Cleanup remote branches once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-branches-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every remote branch except allowlist
        uses: actions/github-script@v7
        with:
          script: |
            const keep = new Set([
              'main',
              'product/lineage-v3-product-completion',
              'fix/lineage-v3-spec-convergence',
              'promo/remotion-preview',
              'agent/english-knowledge-catalog',
            ]);

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const deleted = [];
            const failed = [];

            for (const { name } of branches) {
              if (keep.has(name)) continue;
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${name}`,
                });
                deleted.push(name);
                core.info(`Deleted: ${name}`);
              } catch (error) {
                failed.push(`${name}: ${error.message}`);
                core.warning(`Failed: ${name}: ${error.message}`);
              }
            }

            core.summary
              .addHeading('Remote branch cleanup')
              .addRaw(`Kept: ${[...keep].join(', ')}\n\n`)
              .addRaw(`Deleted: ${deleted.length}\n\n`)
              .addRaw(`Failed: ${failed.length}\n`)
              .write();

            if (failed.length) {
              core.setFailed(`Could not delete ${failed.length} branch(es): ${failed.join(' | ')}`);
            }
