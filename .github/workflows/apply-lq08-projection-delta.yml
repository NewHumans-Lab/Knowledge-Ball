name: Apply LQ-08 projection delta

on:
  push:
    branches:
      - fix/lq08-12-convergence

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lq08-12-convergence
      - name: Apply LQ-08 projection delta refactor
        env:
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$ACTOR" = "github-actions[bot]" ]; then
            exit 0
          fi
          python3 scripts/apply-lq08-projection-delta.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/projection/GraphProjection.ts src/protocol/KnowledgeEditingProtocol.ts src/protocol/KnowledgeEditEventRegression.test.ts scripts/verify-projection-edit-delta.mjs package.json
          git commit -m "Refactor projection edits to apply graph deltas"
          git push origin HEAD:fix/lq08-12-convergence
