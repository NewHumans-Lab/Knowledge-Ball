name: Temporary voice room count center fix

on:
  push:
    branches:
      - fix/voice-room-count-center

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[voice-room-count-center-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply narrowly scoped marker fix
        run: node scripts/apply-voice-room-count-center-fix.mjs
      - name: Assert only runtime source changed before acceptance
        shell: bash
        run: |
          CHANGED="$(git diff --name-only)"
          test "$CHANGED" = "src/ui/voice/VoiceRoomRuntime.ts"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Install Chromium for focused mobile scene acceptance
        run: npx playwright install --with-deps chromium
      - name: Verify mobile scene behavior remains intact
        run: node scripts/verify-mobile-browser.mjs
      - name: Commit only after focused acceptance passes
        shell: bash
        run: |
          rm scripts/apply-voice-room-count-center-fix.mjs
          rm .github/workflows/temp-voice-room-count-center.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/voice/VoiceRoomRuntime.ts scripts/apply-voice-room-count-center-fix.mjs .github/workflows/temp-voice-room-count-center.yml
          git diff --cached --exit-code && { echo 'No fix changes produced'; exit 1; } || true
          git commit -m "fix: center voice room count on node [voice-room-count-center-applied]"
          git push origin HEAD:fix/voice-room-count-center
