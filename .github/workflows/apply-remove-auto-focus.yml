name: Apply automatic-focus cleanup

on:
  push:
    branches:
      - fix/remove-auto-focus-navigation
    paths:
      - scripts/apply-remove-auto-focus.py
      - .github/workflows/apply-remove-auto-focus.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/remove-auto-focus-navigation
          fetch-depth: 0

      - name: Apply exact cleanup
        run: python3 scripts/apply-remove-auto-focus.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Full unit and architecture regression
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Mobile browser regression
        run: npm run test:browser-mobile

      - name: Commit validated cleanup
        run: |
          rm scripts/remove-auto-focus.patch
          rm scripts/apply-remove-auto-focus.py
          rm .github/workflows/apply-remove-auto-focus.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove automatic focus rotation from knowledge navigation"
          git push origin HEAD:fix/remove-auto-focus-navigation
