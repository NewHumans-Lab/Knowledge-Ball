name: Temporary delete accidental branch

on:
  push:
    branches: [cleanup/remove-edit-merge-and-1s-hold]

permissions:
  contents: write

jobs:
  delete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete accidental temporary branch
        run: git push origin --delete noop-temp-check
