name: Temporary sync cleanup to latest main

on:
  push:
    branches: [cleanup/remove-edit-merge-and-1s-hold]

permissions:
  contents: write

jobs:
  sync-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-edit-merge-and-1s-hold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Merge latest main and remove obsolete temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/tmp-remove-edit-merge.yml .github/workflows/tmp-remove-edit-merge-v2.yml
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Full tests
        run: npm test
      - name: I18n tests
        run: npm run test:i18n
      - name: Diff sanity
        run: git diff --check
      - name: Commit temporary workflow cleanup and push
        run: |
          git commit -m "Remove temporary cleanup workflows"
          git push origin HEAD:cleanup/remove-edit-merge-and-1s-hold
