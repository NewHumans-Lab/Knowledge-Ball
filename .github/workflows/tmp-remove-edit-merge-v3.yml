name: Temporary remove edit merge v3

on:
  push:
    branches: [cleanup/remove-edit-merge-and-1s-hold]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-edit-merge-and-1s-hold
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply complete cleanup codemod
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          raw = Path('.github/workflows/tmp-remove-edit-merge.yml').read_text()
          begin = "          python3 <<'PY'\n"
          end = "\n          PY\n"
          start = raw.index(begin) + len(begin)
          stop = raw.index(end, start)
          script = textwrap.dedent(raw[start:stop])
          lines = script.splitlines()
          out=[]; i=0; removed=False
          while i < len(lines):
              if lines[i].strip() == 'sub(ui_test,' and i + 1 < len(lines) and 'mergeConclusionType' in lines[i + 1]:
                  i += 3
                  removed=True
                  continue
              out.append(lines[i]); i += 1
          assert removed
          script='\n'.join(out)+'\n'
          anchor = "replace(app, '  onMergeDefinitions: mergeDefinitions,\\n', '')\n"
          extra = anchor + "replace(app, '  edit: AddEdit | DecomposeEdit | MergeEdit,\\n', '  edit: AddEdit | DecomposeEdit,\\n')\n"
          assert anchor in script
          script = script.replace(anchor, extra, 1)
          old_scan = "if source.is_file() and source.suffix in {'.ts','.tsx','.js','.mjs'}:"
          new_scan = "if source.is_file() and source.suffix in {'.ts','.tsx','.js','.mjs'} and not source.name.endswith('.test.ts'):"
          assert old_scan in script
          script = script.replace(old_scan, new_scan, 1)
          Path('/tmp/remove-edit-merge.py').write_text(script)
          PY
          python3 /tmp/remove-edit-merge.py
          python3 <<'PY'
          from pathlib import Path
          import re

          event_test = Path('src/protocol/KnowledgeEditEventRegression.test.ts')
          text = event_test.read_text()
          text, count = re.subn(
              r"\n  await addAtomic\(runtime, 'def-a'.*?assert\.deepEqual\(runtime\.projection\.state\.nodesById\['merge-c'\]\.premises, \['merge-r'\]\);",
              '', text, flags=re.S,
          )
          assert count == 1, f'expected one merge event fixture block, got {count}'
          text = text.replace("'merge-c'", "'c1'")
          event_test.write_text(text)

          adversarial = Path('src/protocol/ProtocolAdversarialRegression.test.ts')
          text = adversarial.read_text()
          text, count = re.subn(
              r"\nconst definitions = \[.*?\nassert\.deepEqual\(\n  theoryMerge\.nodes\.find\(candidate => candidate\.id === 'theory-dependent'\)\?\.premises,\n  \['tc3'\],\n  'active dependants must be redirected to the unified theory conclusion',\n\);",
              '', text, flags=re.S,
          )
          assert count == 1, f'expected one adversarial merge fixture block, got {count}'
          adversarial.write_text(text)

          for path in ['src/protocol/KnowledgeEditEventRegression.test.ts', 'src/protocol/ProtocolAdversarialRegression.test.ts']:
              source = Path(path).read_text()
              assert "kind: 'merge'" not in source, f'obsolete merge fixture remains in {path}'
              assert 'KnowledgeMerged' not in source, f'obsolete merge event assertion remains in {path}'
          PY
      - name: Build
        run: npm run build
      - name: Full tests
        run: npm test
      - name: I18n tests
        run: npm run test:i18n
      - name: Diff sanity
        run: |
          git diff --check
          git status --short
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts
          git commit -m "Remove edit merge flow and use one-second hold"
          git push origin HEAD:cleanup/remove-edit-merge-and-1s-hold
